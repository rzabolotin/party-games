server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # Оболочка и service worker — всегда перепроверять на сервере
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Хэшированные ассеты — кэшировать навсегда
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }
}
